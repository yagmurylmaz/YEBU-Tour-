# Copy to config/mail.properties (same folder as this example) and fill in real values.
# The app loads resources/mail.properties first, then merges config/mail.properties if present.

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.starttls.enable=true
mail.smtp.auth=true

# Uncomment for verbose SMTP trace in the terminal when debugging send failures:
# mail.debug=true
mail.debug=true

# SMTP username (often your full email for providers like Gmail)
mail.user=yebutour@gmail.com
mail.password=ktec ctkp hgeq mzgq

# From address and display name shown in the inbox (often same as mail.user)
mail.from=yebutour@gmail.com
mail.from.name=YEBU Tour Reservation System
